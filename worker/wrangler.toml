name = "ozel-ders-asistanim-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# api.ozeldersasistanim.com → this Worker (Cloudflare creates the DNS record)
routes = [
  { pattern = "api.ozeldersasistanim.com", custom_domain = true }
]

# Per-IP limit for the public demo: 3 reports per minute
[[ratelimits]]
name = "DEMO_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Per-IP limit for early-access sign-ups: 5 per minute
[[ratelimits]]
name = "WAITLIST_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Early-access list (one key per e-mail address)
[[kv_namespaces]]
binding = "WAITLIST"
id = "e0124a590f8d48e3b1c3d57a7cf7e852"

[observability]
enabled = true

# Secret (never committed): ANTHROPIC_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
